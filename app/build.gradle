plugins {
    id 'com.android.application'
}

def productionKeystorePath = System.getenv("CACONNECTION_RELEASE_KEYSTORE")
def productionKeystorePassword = System.getenv("CACONNECTION_RELEASE_STORE_PASSWORD")
def productionKeyAlias = System.getenv("CACONNECTION_RELEASE_KEY_ALIAS")
def productionKeyPassword = System.getenv("CACONNECTION_RELEASE_KEY_PASSWORD")
def productionSigningConfigured = [
        productionKeystorePath,
        productionKeystorePassword,
        productionKeyAlias,
        productionKeyPassword
].every { it != null && !it.isBlank() }

android {
    namespace = 'com.caconnection'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.caconnection"
        minSdk = 31
        targetSdk = 37
        versionCode = 8
        versionName = "0.2.6"
        buildConfigField("String", "POC_BUILD", '"targetSdk 37"')
        manifestPlaceholders = [appLabel: "CA Connection"]
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    signingConfigs {
        if (productionSigningConfigured) {
            production {
                storeFile = file(productionKeystorePath)
                storePassword = productionKeystorePassword
                keyAlias = productionKeyAlias
                keyPassword = productionKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            applicationIdSuffix = ".gateway"
            manifestPlaceholders = [appLabel: "CA Connection"]
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            if (productionSigningConfigured) {
                signingConfig = signingConfigs.production
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        // AGP 9.4 supports Gradle up to 9.6; keep the wrapper inside that range.
        disable += "AndroidGradlePluginVersion"
    }
}

tasks.register("verifyProductionSigning") {
    doLast {
        if (!productionSigningConfigured) {
            throw new GradleException(
                    "Production signing environment variables are not configured"
            )
        }
        if (!file(productionKeystorePath).isFile()) {
            throw new GradleException("Production keystore file does not exist")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    // WorkManager for durable background processing
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

openapi: 3.1.0
info:
  title: CA Connection Gateway API
  version: 0.4.1
  description: >
    Production API for Android gateway ingestion, authenticated SMS and
    notification retrieval, remote outbound SMS commands, device management,
    pairing, and one-time OTP claims. Sensitive request and response bodies
    must never be logged.
servers:
  - url: https://gateway.example.com
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Process is running
  /ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Device configuration and database are ready
        "503":
          description: Service is not ready
  /version:
    get:
      summary: Service and protocol version
      responses:
        "200":
          description: Version information
  /v1/events:
    post:
      summary: Upload one encrypted Android Outbox event
      parameters:
        - in: header
          name: X-Gateway-Device
          required: true
          schema:
            type: string
        - in: header
          name: X-Gateway-Timestamp
          required: true
          schema:
            type: integer
        - in: header
          name: X-Gateway-Nonce
          required: true
          schema:
            type: string
        - in: header
          name: X-Gateway-Signature
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedEnvelope"
      responses:
        "201":
          description: New event accepted
        "200":
          description: Idempotent duplicate accepted
        "400":
          description: Invalid encrypted request
        "401":
          description: Device authentication failed
        "409":
          description: Request nonce replay
        "429":
          description: Rate limit exceeded
  /v1/device-commands/claim:
    post:
      summary: Claim queued outbound SMS commands for one Android gateway
      description: >
        Uses the same device HMAC headers as event ingestion. Claimed command
        payloads contain sensitive recipient and message-body fields and must
        never be logged.
      parameters:
        - in: header
          name: X-Gateway-Device
          required: true
          schema:
            type: string
        - in: header
          name: X-Gateway-Timestamp
          required: true
          schema:
            type: integer
        - in: header
          name: X-Gateway-Nonce
          required: true
          schema:
            type: string
        - in: header
          name: X-Gateway-Signature
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
      responses:
        "200":
          description: Commands claimed for a five-minute processing lease
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutboundMessage"
        "400":
          description: Invalid request
        "401":
          description: Device authentication failed
        "409":
          description: Request nonce replay
        "429":
          description: Rate limit exceeded
  /v1/pairings:
    post:
      summary: Create a short-lived Android pairing QR payload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              additionalProperties: false
              properties:
                deviceId:
                  type: string
                expiresInSeconds:
                  type: integer
                  minimum: 60
                  maximum: 600
                  default: 300
      responses:
        "201":
          description: One-time QR payload created; never log its payload
        "400":
          description: Invalid request or unknown device
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
        "429":
          description: Rate limit exceeded
        "503":
          description: Pairing is not configured
  /v1/devices:
    get:
      summary: List configured device IDs available for pairing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configured device IDs
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
    post:
      summary: Add a gateway device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device:
                    $ref: "#/components/schemas/GatewayDevice"
        "400":
          description: Invalid request
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
        "409":
          description: Device already exists
  /v1/devices/detail:
    get:
      summary: List gateway device metadata without exposing secrets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device inventory
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/GatewayDevice"
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
  /v1/devices/{deviceId}:
    parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    put:
      summary: Update a device description or rotate its shared secret
      description: >
        Secret rotation atomically re-encrypts historical event payloads so
        previously captured messages remain readable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device:
                    $ref: "#/components/schemas/GatewayDevice"
        "400":
          description: Invalid request
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
        "404":
          description: Device not found
    delete:
      summary: Retire a gateway device
      description: >
        Retirement disables device authentication, pairing, and new commands
        while retaining its secret so historical encrypted content remains
        readable. Use the separate purge operation for irreversible deletion.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device retired
        "400":
          description: Invalid device ID
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
        "404":
          description: Device not found
  /v1/devices/{deviceId}/restore:
    parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    post:
      summary: Restore a retired gateway device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Device restored
        "400":
          description: Invalid request
        "401":
          description: API authentication failed
        "403":
          description: Token lacks access to this device
        "404":
          description: Device not found
  /v1/devices/{deviceId}/purge:
    parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    post:
      summary: Irreversibly purge a gateway and all associated data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: Must exactly equal `PURGE {deviceId}`.
      responses:
        "200":
          description: Device and associated data purged
        "400":
          description: Exact confirmation was not supplied
        "401":
          description: API authentication failed
        "403":
          description: Token lacks access to this device
        "404":
          description: Device not found
  /v1/pairings/claim:
    post:
      summary: Atomically exchange a one-time pairing token for provisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingToken]
              additionalProperties: false
              properties:
                pairingToken:
                  type: string
                  minLength: 32
                  maxLength: 128
      responses:
        "200":
          description: Provisioning document containing the device secret
        "400":
          description: Invalid request
        "410":
          description: Token expired, unknown, or already consumed
        "429":
          description: Rate limit exceeded
  /v1/messages:
    get:
      summary: Read decrypted incoming SMS messages
      description: deviceId and groupId are mutually exclusive.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: afterId
          schema:
            type: integer
            minimum: 0
        - in: query
          name: beforeId
          description: Return older records whose ID is lower than this cursor.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: slotIndex
          schema:
            type: integer
            enum: [0, 1]
        - in: query
          name: deviceId
          description: >
            Restrict results to one gateway. API clients configured with
            allowedDeviceIds may only select devices in that allowlist.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
        - in: query
          name: groupId
          description: >
            Restrict results to members of one Gateway group. Scoped clients
            receive not found when the group has no accessible members.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: Messages, including sensitive sender and body fields
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/IncomingMessage"
        "400":
          description: Invalid query
        "401":
          description: API authentication failed
        "403":
          description: Token lacks messages:read scope
        "404":
          description: Gateway group not found or not accessible
        "429":
          description: Rate limit exceeded
  /v1/notifications:
    get:
      summary: Read decrypted notifications captured from allowlisted apps
      description: deviceId and groupId are mutually exclusive.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: afterId
          schema:
            type: integer
            minimum: 0
        - in: query
          name: beforeId
          description: Return older records whose ID is lower than this cursor.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: deviceId
          description: >
            Restrict results to one gateway. API clients configured with
            allowedDeviceIds may only select devices in that allowlist.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
        - in: query
          name: groupId
          description: >
            Restrict results to members of one Gateway group. Scoped clients
            receive not found when the group has no accessible members.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: Notifications, including sensitive title and body fields
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/CapturedNotification"
        "400":
          description: Invalid query
        "401":
          description: API authentication failed
        "403":
          description: Token lacks messages:read scope
        "404":
          description: Gateway group not found or not accessible
        "429":
          description: Rate limit exceeded
  /v1/outbound-messages:
    get:
      summary: List remote outbound SMS commands and their current status
      description: >
        deviceId and groupId are mutually exclusive. Groups are read-only
        filters and never select a target for a new outbound command.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: beforeId
          description: Return older records whose ID is lower than this cursor.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: deviceId
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
        - in: query
          name: groupId
          description: >
            Restrict results to members of one Gateway group. Scoped clients
            receive not found when the group has no accessible members.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: >
            Commands including sensitive recipient and message-body fields.
            Expired queued or claimed commands are reported as EXPIRED.
          content:
            application/json:
              schema:
                type: object
                required: [outboundMessages]
                properties:
                  outboundMessages:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutboundMessage"
        "400":
          description: Invalid query
        "401":
          description: API authentication failed
        "403":
          description: Token lacks messages:send scope
        "404":
          description: Gateway group not found or not accessible
        "429":
          description: Rate limit exceeded
    post:
      summary: Queue an outbound SMS command for an Android gateway
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundMessageCreate"
      responses:
        "201":
          description: Command queued, or the matching idempotent command returned
          content:
            application/json:
              schema:
                type: object
                required: [outboundMessage]
                properties:
                  outboundMessage:
                    $ref: "#/components/schemas/OutboundMessage"
        "400":
          description: Invalid request
        "401":
          description: API authentication failed
        "403":
          description: Token lacks messages:send scope
        "409":
          description: Idempotency key was already used for a different command
        "429":
          description: Rate limit exceeded
  /v1/device-groups:
    get:
      summary: List Gateway groups and their accessible members
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Gateway groups
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/GatewayDeviceGroup"
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
    post:
      summary: Create a Gateway group
      description: Group membership never enables automatic SMS rerouting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayDeviceGroupCreate"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/GatewayDeviceGroup"
        "400":
          description: Invalid group or unknown device
        "401":
          description: API authentication failed
        "403":
          description: Global device access is required
        "409":
          description: Group already exists
        "429":
          description: Rate limit exceeded
  /v1/device-groups/{groupId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
    put:
      summary: Rename a Gateway group or replace its members
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayDeviceGroupUpdate"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/GatewayDeviceGroup"
        "400":
          description: Invalid group update
        "401":
          description: API authentication failed
        "403":
          description: Global device access is required
        "404":
          description: Group not found
        "429":
          description: Rate limit exceeded
    delete:
      summary: Delete a Gateway group without deleting its devices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    const: true
        "401":
          description: API authentication failed
        "403":
          description: Global device access is required
        "404":
          description: Group not found
        "429":
          description: Rate limit exceeded
  /v1/otp/claim:
    post:
      summary: Atomically claim the newest unclaimed OTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  pattern: "^[A-Za-z0-9._-]{1,64}$"
                  description: >
                    Required when eventId is omitted. Together with slotIndex,
                    this forms the stable latest-OTP route.
                slotIndex:
                  type: integer
                  enum: [0, 1]
                maxAgeSeconds:
                  type: integer
                  minimum: 30
                  maximum: 3600
                eventId:
                  type: integer
                  minimum: 1
                  description: >
                    Claim only this exact incoming-message event. This makes
                    one-time consumption deterministic when several OTP
                    messages are inside the age window.
              additionalProperties: false
      responses:
        "200":
          description: OTP claimed; the code is sensitive and returned once
          content:
            application/json:
              schema:
                type: object
                required: [otp]
                properties:
                  otp:
                    $ref: "#/components/schemas/OtpClaim"
        "400":
          description: Invalid request
        "404":
          description: No unclaimed OTP is available
        "401":
          description: API authentication failed
        "403":
          description: Token lacks otp:claim scope
        "429":
          description: Rate limit exceeded
  /v1/audit-log:
    get:
      summary: List administrative actions without message or OTP content
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: beforeId
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Device-scoped audit entries
        "400":
          description: Invalid query
        "401":
          description: API authentication failed
        "403":
          description: Token lacks pairing:create scope
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    GatewayDevice:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - description
        - createdAt
        - lastSeenAt
        - retiredAt
        - health
        - status
      properties:
        deviceId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        description:
          type: string
        createdAt:
          type: integer
        lastSeenAt:
          type: [integer, "null"]
        retiredAt:
          type: [integer, "null"]
        health:
          type: string
          enum: [ONLINE, STALE, OFFLINE, NEVER, RETIRED]
        status:
          $ref: "#/components/schemas/GatewayDeviceStatus"
    GatewayDeviceStatus:
      type: object
      additionalProperties: false
      required:
        - observedAt
        - appVersion
        - versionCode
        - targetSdk
        - androidVersion
        - manufacturer
        - model
        - receiveMode
        - defaultSmsRole
        - permissions
        - lastIncomingSmsAt
        - lastOtpAt
        - lastOrdinarySmsAt
        - lastReceiverAction
        - lastReceiverActionAt
        - lastReceiverInvokedAt
        - lastReceiverInvokedAction
        - lastReceiverParseFailureAt
        - lastReceiverParseFailureReason
        - lines
      properties:
        observedAt:
          type: [integer, "null"]
        appVersion:
          type: [string, "null"]
        versionCode:
          type: [integer, "null"]
        targetSdk:
          type: [integer, "null"]
        androidVersion:
          type: [string, "null"]
        manufacturer:
          type: [string, "null"]
        model:
          type: [string, "null"]
        receiveMode:
          type: [string, "null"]
          enum: [OBSERVER, DEFAULT_SMS, null]
        defaultSmsRole:
          type: [boolean, "null"]
        permissions:
          type: object
          required: [receiveSms, sendSms, readPhoneState]
          properties:
            receiveSms:
              type: [boolean, "null"]
            sendSms:
              type: [boolean, "null"]
            readPhoneState:
              type: [boolean, "null"]
        lastIncomingSmsAt:
          type: [integer, "null"]
        lastOtpAt:
          type: [integer, "null"]
        lastOrdinarySmsAt:
          type: [integer, "null"]
        lastReceiverAction:
          type: [string, "null"]
          enum: [SMS_RECEIVED, SMS_DELIVER, null]
        lastReceiverActionAt:
          type: [integer, "null"]
        lastReceiverInvokedAt:
          type: [integer, "null"]
        lastReceiverInvokedAction:
          type: [string, "null"]
          enum: [SMS_RECEIVED, SMS_DELIVER, null]
        lastReceiverParseFailureAt:
          type: [integer, "null"]
        lastReceiverParseFailureReason:
          type: [string, "null"]
          enum:
            - NO_MESSAGES
            - PARSER_EXCEPTION
            - PROCESSING_EXCEPTION
            - null
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GatewayLine"
    GatewayLine:
      type: object
      additionalProperties: false
      required:
        - slotIndex
        - subscriptionId
        - carrierName
        - displayName
        - active
        - observedAt
      properties:
        slotIndex:
          type: integer
          minimum: 0
          maximum: 3
        subscriptionId:
          type: [integer, "null"]
        carrierName:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        active:
          type: boolean
        observedAt:
          type: integer
    GatewayDeviceGroup:
      type: object
      additionalProperties: false
      required: [groupId, name, deviceIds, createdAt, updatedAt]
      properties:
        groupId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        deviceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
        createdAt:
          type: integer
        updatedAt:
          type: integer
    GatewayDeviceGroupCreate:
      type: object
      additionalProperties: false
      required: [groupId, name, deviceIds]
      properties:
        groupId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        deviceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
    GatewayDeviceGroupUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        deviceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
    DeviceCreate:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - secretBase64
      properties:
        deviceId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        secretBase64:
          type: string
          description: Base64-encoded shared secret containing at least 32 bytes.
        description:
          type: string
          default: ""
    DeviceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        secretBase64:
          type: string
          description: >
            New Base64-encoded shared secret containing at least 32 bytes.
            Existing encrypted event payloads are re-encrypted atomically.
        description:
          type: string
    EncryptedEnvelope:
      type: object
      additionalProperties: true
      required:
        - schemaVersion
        - deliveryId
        - sourceEventId
        - eventType
        - createdAt
        - payload
      properties:
        schemaVersion:
          type: integer
          const: 2
        deliveryId:
          type: string
        sourceEventId:
          type: string
        eventType:
          type: string
          enum:
            - INCOMING_SMS
            - NOTIFICATION
            - CALL_STATE
            - CALL_IDENTITY
            - OUTBOUND_SMS_STATUS
            - DEVICE_STATE
            - LOCAL_SELF_TEST
        createdAt:
          type: integer
        subscriptionId:
          type:
            - integer
            - "null"
        slotIndex:
          type:
            - integer
            - "null"
        payload:
          type: object
          additionalProperties: true
          required:
            - algorithm
            - nonceBase64
            - ciphertextBase64
          properties:
            algorithm:
              type: string
              const: AES-256-GCM
            nonceBase64:
              type: string
            ciphertextBase64:
              type: string
    IncomingMessage:
      type: object
      required:
        - id
        - deviceId
        - createdAt
        - receivedAt
        - subscriptionId
        - slotIndex
        - sender
        - body
        - partCount
        - resolutionMethod
        - resolutionConfidence
        - otpCandidates
      properties:
        id:
          type: integer
        deviceId:
          type: string
        createdAt:
          type: integer
        receivedAt:
          type: integer
        subscriptionId:
          type: [integer, "null"]
        slotIndex:
          type: [integer, "null"]
        sender:
          type: [string, "null"]
        body:
          type: [string, "null"]
        partCount:
          type: [integer, "null"]
        resolutionMethod:
          type: [string, "null"]
        resolutionConfidence:
          type: [string, "null"]
        otpCandidates:
          type: array
          items:
            type: string
            pattern: "^[0-9]{4,8}$"
    CapturedNotification:
      type: object
      required:
        - id
        - deviceId
        - createdAt
        - receivedAt
        - eventType
        - sourcePackage
        - notificationId
        - postedAt
        - observedAt
        - channelId
        - category
        - title
        - body
      properties:
        id:
          type: integer
        deviceId:
          type: string
        createdAt:
          type: integer
        receivedAt:
          type: integer
        eventType:
          type: [string, "null"]
          enum: [POSTED, REMOVED, null]
        sourcePackage:
          type: [string, "null"]
        notificationId:
          type: [integer, "null"]
        postedAt:
          type: [integer, "null"]
        observedAt:
          type: [integer, "null"]
        channelId:
          type: [string, "null"]
        category:
          type: [string, "null"]
        title:
          type: [string, "null"]
        body:
          type: [string, "null"]
    OutboundMessageCreate:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - slotIndex
        - recipient
        - body
        - idempotencyKey
      properties:
        deviceId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        slotIndex:
          type: integer
          enum: [0, 1]
          description: Physical SIM slot requested on the gateway device.
        recipient:
          type: string
          minLength: 1
          maxLength: 64
        body:
          type: string
          minLength: 1
          maxLength: 2000
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
        idempotencyKey:
          type: string
          pattern: "^[A-Za-z0-9._-]{16,128}$"
    OutboundMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - commandId
        - deviceId
        - slotIndex
        - recipient
        - body
        - status
        - createdAt
        - expiresAt
        - claimedAt
        - updatedAt
        - lastResultCode
        - errorDetail
      properties:
        id:
          type: integer
        commandId:
          type: string
          pattern: "^[A-Za-z0-9_-]{16,128}$"
        deviceId:
          type: string
        slotIndex:
          type: integer
          enum: [0, 1]
        recipient:
          type: string
        body:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - CLAIMED
            - CREATED
            - DISPATCHING
            - SENT_TO_MODEM
            - DELIVERED
            - FAILED
            - EXPIRED
        createdAt:
          type: integer
        expiresAt:
          type: integer
        claimedAt:
          type: [integer, "null"]
        updatedAt:
          type: integer
        lastResultCode:
          type: [integer, "null"]
        errorDetail:
          type: [string, "null"]
    OtpClaim:
      type: object
      required:
        - eventId
        - deviceId
        - receivedAt
        - subscriptionId
        - slotIndex
        - code
        - expiresAt
      properties:
        eventId:
          type: integer
        deviceId:
          type: string
        receivedAt:
          type: integer
        subscriptionId:
          type: [integer, "null"]
        slotIndex:
          type: [integer, "null"]
        code:
          type: string
          pattern: "^[0-9]{4,8}$"
        expiresAt:
          type: integer

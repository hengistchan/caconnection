name: caconnection-gateway

services:
  gateway:
    image: caconnection-gateway:0.2.0
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - gateway_data:/var/lib/gateway
      - gateway_backups:/var/lib/gateway/backups
    secrets:
      - gateway_config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - --no-autoupdate
      - --config
      - /run/secrets/cloudflare_tunnel_config
      - tunnel
      - run
    secrets:
      - cloudflare_tunnel_config
      - cloudflare_tunnel_credentials
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    networks:
      - edge
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  smoke:
    image: caconnection-gateway:0.2.0
    profiles:
      - tools
    entrypoint:
      - python
      - -m
      - server.protocol_smoke
    secrets:
      - gateway_config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  gateway_data:
  gateway_backups:

networks:
  edge:
  backend:
    internal: true

secrets:
  gateway_config:
    file: ./runtime/config.json
  cloudflare_tunnel_config:
    file: ./runtime/cloudflared-config.yml
  cloudflare_tunnel_credentials:
    file: ./runtime/cloudflare-tunnel-credentials.json

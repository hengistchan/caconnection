name: caconnection-gateway

services:
  gateway:
    image: caconnection-gateway:0.6.0
    build:
      context: ../../server-node
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - gateway_data:/var/lib/gateway
      - gateway_backups:/var/lib/gateway/backups
    secrets:
      - gateway_config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.50
    networks:
      - default
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"


  smoke:
    image: caconnection-gateway:0.6.0
    profiles:
      - tools
    entrypoint:
      - node
      - /app/dist/operations/protocol-smoke.js
    secrets:
      - gateway_config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - backend

volumes:
  gateway_data:
  gateway_backups:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true

secrets:
  gateway_config:
    file: ./runtime/config.json
